name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: test "v$(ruby -Ilib -e 'require "billionverify/version"; print BillionVerify::VERSION')" = "${GITHUB_REF_NAME}"
      - run: bundle exec rake test
      - run: gem build billionverify.gemspec
      - name: Check whether this version is already on RubyGems
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -fsS "https://rubygems.org/api/v2/rubygems/billionverify/versions/${version}.json" > /dev/null; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to RubyGems
        if: steps.published.outputs.done != 'true'
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push billionverify-*.gem
